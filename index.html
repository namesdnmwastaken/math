<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: white; display: flex; align-items: center; justify-content: center; height: 100vh; }
  button { padding: 12px 32px; font-size: 16px; cursor: pointer; }
  iframe { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #btn { display: block; }
</style>
</head>
<body>
<button id="btn" onclick="play()">▶ Play</button>
<iframe id="yt" frameborder="0" allow="autoplay"></iframe>
<script>
  function play() {
    document.getElementById('yt').src = 'https://www.youtube.com/embed/2VQjQt5MxIc?autoplay=1&loop=1&playlist=2VQjQt5MxIc&controls=0';
    document.getElementById('btn').style.display = 'none';
  }
</script>
</body>
</html>
